<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Your Customer Hunt product inbox.">
  <title>Product Inbox | Customer Hunt</title>

  <style>
    :root {
      --background: #ffffff;
      --surface: #ffffff;
      --text: #202124;
      --muted: #70757a;
      --border: #e8eaed;
      --soft: #f8f9fa;
      --red: #d93025;
      --red-soft: #fce8e6;
      --green: #188038;
      --shadow: 0 2px 8px rgba(60, 64, 67, .08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button, a {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: 100%;
      max-width: 1180px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      display: block;
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.5px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #5f6368;
      font-size: 13px;
      font-weight: 600;
      transition: color .2s ease;
    }

    .back-link:hover {
      color: var(--text);
    }

    .back-arrow {
      font-size: 19px;
      line-height: 1;
    }

    main {
      flex: 1;
      padding: 38px 0 48px;
    }

    .product-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .heading-copy {
      min-width: 0;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .product-name {
      font-size: clamp(25px, 4vw, 34px);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.8px;
      overflow-wrap: anywhere;
    }

    .product-location {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .inbox-count {
      min-width: 36px;
      height: 36px;
      padding: 0 11px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      background: var(--red-soft);
      color: var(--red);
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }

    .inbox-toolbar {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0 4px;
    }

    .inbox-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .inbox-label svg {
      width: 17px;
      height: 17px;
      color: #5f6368;
    }

    .lead-total {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .refresh-button {
      min-height: 34px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: #5f6368;
      font-size: 12px;
      font-weight: 600;
      transition: background .2s ease, border-color .2s ease;
    }

    .refresh-button:hover {
      background: var(--soft);
      border-color: #dadce0;
    }

    .refresh-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .refresh-icon {
      font-size: 15px;
      line-height: 1;
    }

    .status-message {
      display: none;
      margin: 18px 0;
      padding: 12px 14px;
      border-radius: 7px;
      font-size: 13px;
    }

    .status-message.visible {
      display: block;
    }

    .status-message.error {
      color: #b3261e;
      background: #fce8e6;
    }

    .status-message.info {
      color: #3c4043;
      background: #f1f3f4;
    }

    .lead-list {
      width: 100%;
    }

    .lead-row {
      min-height: 76px;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 13px 12px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      transition: background .15s ease;
    }

    .lead-row:hover {
      background: #f8fafd;
    }

    .lead-row.unread {
      background: #fff;
    }

    .lead-row.unread:hover {
      background: #f8fafd;
    }

    .lead-main {
      min-width: 0;
    }

    .lead-title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-bottom: 5px;
    }

    .lead-title {
      min-width: 0;
      overflow: hidden;
      color: #3c4043;
      font-size: 13px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lead-row.unread .lead-title {
      color: #202124;
      font-weight: 700;
    }

    .new-label {
      display: none;
      flex-shrink: 0;
      color: var(--red);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .lead-row.unread .new-label {
      display: inline;
    }

    .lead-excerpt {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }

    .lead-row.unread .lead-excerpt {
      color: #5f6368;
      font-weight: 500;
    }

    .lead-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
      flex-shrink: 0;
    }

    .lead-row.unread .lead-indicator {
      background: var(--red);
    }
        .empty-state {
      display: none;
      padding: 75px 20px;
      text-align: center;
    }

    .empty-state.visible {
      display: block;
    }

    .empty-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--soft);
      color: #5f6368;
      font-size: 23px;
    }

    .empty-title {
      margin-bottom: 7px;
      color: #202124;
      font-size: 17px;
      font-weight: 700;
    }

    .empty-description {
      max-width: 360px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .loading-state {
      padding: 45px 15px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .loading-spinner {
      width: 23px;
      height: 23px;
      margin: 0 auto 12px;
      border: 2px solid #e8eaed;
      border-top-color: #5f6368;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(32, 33, 36, .42);
    }

    .detail-overlay.open {
      display: flex;
    }

    .detail-card {
      width: 100%;
      max-width: 580px;
      max-height: min(85vh, 720px);
      overflow-y: auto;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
    }

    .detail-header {
      min-height: 58px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .detail-header-title {
      font-size: 13px;
      font-weight: 700;
    }

    .close-detail {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #5f6368;
      font-size: 23px;
    }

    .close-detail:hover {
      background: var(--soft);
    }

    .detail-content {
      padding: 25px 22px;
    }

    .detail-new {
      display: none;
      margin-bottom: 12px;
      color: var(--red);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .7px;
    }

    .detail-new.visible {
      display: block;
    }

    .detail-title {
      margin-bottom: 14px;
      color: #202124;
      font-size: 21px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .detail-excerpt {
      color: #5f6368;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .detail-actions {
      padding: 17px 22px 22px;
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
    }

    .visit-source {
      min-height: 42px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 6px;
      background: #202124;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      transition: background .2s ease;
    }

    .visit-source:hover {
      background: #3c4043;
    }

    .visit-source:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    footer {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .footer-brand {
      color: #5f6368;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .footer-links a {
      color: #5f6368;
      transition: color .2s ease;
    }

    .footer-links a:hover {
      color: #202124;
      text-decoration: underline;
    }

    button:focus-visible,
    a:focus-visible,
    .lead-row:focus-visible {
      outline: 2px solid #1a73e8;
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .page {
        padding: 0 16px;
      }

      .topbar {
        height: 66px;
      }

      .brand img {
        width: 36px;
        height: 36px;
      }

      .brand-name {
        font-size: 16px;
      }

      main {
        padding-top: 28px;
      }

      .product-heading {
        margin-bottom: 24px;
      }

      .lead-row {
        min-height: 78px;
        padding: 12px 7px;
        gap: 10px;
      }

      .lead-title {
        font-size: 12px;
      }

      .lead-excerpt {
        font-size: 11px;
      }

      footer {
        min-height: 90px;
        padding: 18px 0;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
      }

      .footer-links {
        gap: 15px;
        flex-wrap: wrap;
      }

      .detail-overlay {
        padding: 10px;
      }

      .detail-content {
        padding: 22px 18px;
      }

      .detail-actions {
        padding: 15px 18px 18px;
      }
    }

    @media (max-width: 380px) {
      .back-link {
        font-size: 11px;
      }

      .inbox-toolbar {
        gap: 8px;
      }

      .refresh-button {
        padding: 0 9px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="topbar">
      <a class="brand" href="/dashboard.html" aria-label="Customer Hunt dashboard">
        <img src="/logo.png" alt="Customer Hunt logo">
        <span class="brand-name">Customer Hunt</span>
      </a>

      <a class="back-link" href="/dashboard.html">
        <span class="back-arrow" aria-hidden="true">‹</span>
        <span>Dashboard</span>
      </a>
    </header>

    <main>
      <section class="product-heading">
        <div class="heading-copy">
          <div class="eyebrow">Product inbox</div>
          <h1 class="product-name" id="productName">Loading product...</h1>
          <p class="product-location" id="productLocation"></p>
        </div>

        <span class="inbox-count" id="unreadCount" aria-label="Unread leads">0</span>
      </section>

      <section class="inbox-toolbar">
        <div class="inbox-label">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 5.5h16v13H4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="m4.5 6 7.5 6 7.5-6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>

          <span>All leads</span>
          <span class="lead-total" id="leadTotal">Loading...</span>
        </div>

        <button class="refresh-button" id="refreshButton" type="button">
          <span class="refresh-icon" aria-hidden="true">↻</span>
          <span>Refresh</span>
        </button>
      </section>

      <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>

      <section class="lead-list" id="leadList" aria-live="polite">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          Loading your leads...
        </div>
      </section>

      <section class="empty-state" id="emptyState">
        <div class="empty-icon" aria-hidden="true">⌕</div>
        <h2 class="empty-title">No leads yet</h2>
        <p class="empty-description">
          Your product inbox is ready. Qualifying buyer discoveries will appear here as they are found.
        </p>
      </section>
    </main>

    <footer>
      <span class="footer-brand">© <span id="currentYear"></span> Customer Hunt</span>

      <nav class="footer-links" aria-label="Footer navigation">
        <a href="/policies.html">Policies</a>
        <a href="/terms.html">Terms</a>
      </nav>
    </footer>

  </div>
    <div class="detail-overlay" id="detailOverlay" aria-hidden="true">
    <article
      class="detail-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailTitle"
      tabindex="-1"
    >
      <header class="detail-header">
        <span class="detail-header-title">Lead details</span>
        <button class="close-detail" id="closeDetail" type="button" aria-label="Close">×</button>
      </header>

      <div class="detail-content">
        <div class="detail-new" id="detailNew">NEW LEAD</div>
        <h2 class="detail-title" id="detailTitle"></h2>
        <p class="detail-excerpt" id="detailExcerpt"></p>
      </div>

      <div class="detail-actions">
        <button class="visit-source" id="visitSource" type="button">
          VISIT SOURCE <span aria-hidden="true">↗</span>
        </button>
      </div>
    </article>
  </div>

  <script>
    "use strict";

    const API_URL = "/api/get-leads";

    const elements = {
      productName: document.getElementById("productName"),
      productLocation: document.getElementById("productLocation"),
      unreadCount: document.getElementById("unreadCount"),
      leadTotal: document.getElementById("leadTotal"),
      leadList: document.getElementById("leadList"),
      emptyState: document.getElementById("emptyState"),
      statusMessage: document.getElementById("statusMessage"),
      refreshButton: document.getElementById("refreshButton"),
      detailOverlay: document.getElementById("detailOverlay"),
      detailCard: document.querySelector(".detail-card"),
      detailTitle: document.getElementById("detailTitle"),
      detailExcerpt: document.getElementById("detailExcerpt"),
      detailNew: document.getElementById("detailNew"),
      closeDetail: document.getElementById("closeDetail"),
      visitSource: document.getElementById("visitSource")
    };

    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    let leads = [];
    let selectedLead = null;
    let isLoading = false;
    let previousFocusedElement = null;

    document.getElementById("currentYear").textContent =
      new Date().getFullYear();

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function showStatus(message, type = "info") {
      elements.statusMessage.textContent = message;
      elements.statusMessage.className =
        "status-message visible " + type;
    }

    function hideStatus() {
      elements.statusMessage.textContent = "";
      elements.statusMessage.className = "status-message";
    }

    function validSourceUrl(value) {
      if (typeof value !== "string" || !value.trim()) {
        return null;
      }

      try {
        const url = new URL(value);

        if (
          (url.protocol !== "https:" && url.protocol !== "http:") ||
          url.username ||
          url.password
        ) {
          return null;
        }

        return url.href;
      } catch {
        return null;
      }
    }

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        credentials: "same-origin",
        ...options,
        headers: {
          "Accept": "application/json",
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers || {})
        }
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error("The server returned an invalid response.");
      }

      if (response.status === 401) {
        window.location.replace("/signup.html");
        throw new Error("Your session has expired.");
      }

      if (response.status === 403) {
        throw new Error(
          data.message || "You do not have permission to access this resource."
        );
      }

      if (!response.ok || !data || data.success !== true) {
        throw new Error(
          data && (data.message || data.error)
            ? data.message || data.error
            : "Something went wrong. Please try again."
        );
      }

      return data;
    }

    function setLoading(loading) {
      isLoading = loading;
      elements.refreshButton.disabled = loading;

      elements.refreshButton.innerHTML = loading
        ? '<span class="refresh-icon" aria-hidden="true">↻</span><span>Loading...</span>'
        : '<span class="refresh-icon" aria-hidden="true">↻</span><span>Refresh</span>';
    }

    function updateUnreadCount(count) {
      const safeCount = Math.max(0, Number(count) || 0);

      elements.unreadCount.textContent =
        safeCount > 99 ? "99+" : String(safeCount);

      elements.unreadCount.setAttribute(
        "aria-label",
        safeCount + " unread leads"
      );

      elements.unreadCount.style.display =
        safeCount > 0 ? "inline-flex" : "none";
    }

    function renderLead(lead) {
      const title = escapeHTML(lead.title || "Untitled lead");
      const excerpt = escapeHTML(
        lead.excerpt || "Open this lead to view its details."
      );

      const unread = lead.isRead === false;

      return `
        <article
          class="lead-row ${unread ? "unread" : ""}"
          data-lead-id="${escapeHTML(lead.id)}"
          tabindex="0"
          role="button"
          aria-label="Open lead: ${title}"
        >
          <div class="lead-main">
            <div class="lead-title-line">
              <span class="lead-title">${title}</span>
              <span class="new-label">NEW</span>
            </div>
            <p class="lead-excerpt">${excerpt}</p>
          </div>
          <span class="lead-indicator" aria-hidden="true"></span>
        </article>
      `;
    }

    function renderLeads() {
      elements.leadTotal.textContent =
        leads.length === 1 ? "1 lead" : `${leads.length} leads`;

      if (!leads.length) {
        elements.leadList.innerHTML = "";
        elements.emptyState.classList.add("visible");
        updateUnreadCount(0);
        return;
      }

      elements.emptyState.classList.remove("visible");

      elements.leadList.innerHTML = leads
        .map(renderLead)
        .join("");

      const unread = leads.filter(
        lead => lead.isRead === false
      ).length;

      updateUnreadCount(unread);

      elements.leadList.querySelectorAll(".lead-row").forEach(row => {
        row.addEventListener("click", () => {
          openLead(row.dataset.leadId, row);
        });

        row.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openLead(row.dataset.leadId, row);
          }
        });
      });
    }

    function sortLeadsNewestFirst(items) {
      return [...items].sort((a, b) => {
        const dateA = Date.parse(a.createdAt || "") || 0;
        const dateB = Date.parse(b.createdAt || "") || 0;

        return dateB - dateA;
      });
    }

    async function clearProductUnreadBadge() {
      return apiRequest(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "open-product",
          productId
        })
      });
    }
        async function loadInbox() {
      if (isLoading) return;

      setLoading(true);
      hideStatus();

      let badgeUpdateFailed = false;

      try {
        /*
         * Mark the product as opened before fetching its leads.
         * This reduces the chance of clearing notifications for
         * leads that arrive while the inbox request is in progress.
         *
         * This action must not mark individual leads as read.
         */
        try {
          await clearProductUnreadBadge();
        } catch (error) {
          badgeUpdateFailed = true;
        }

        const data = await apiRequest(
          `${API_URL}?productId=${encodeURIComponent(productId)}`
        );

        if (
          !data.product ||
          !Array.isArray(data.leads)
        ) {
          throw new Error(
            "The server returned incomplete inbox information."
          );
        }

        elements.productName.textContent =
          data.product.name || "Product inbox";

        elements.productLocation.textContent =
          data.product.targetLocation
            ? "Target location: " + data.product.targetLocation
            : "";

        leads = sortLeadsNewestFirst(data.leads);

        renderLeads();

        if (badgeUpdateFailed) {
          showStatus(
            "Your inbox loaded, but the dashboard unread count could not be updated.",
            "info"
          );
        }

      } catch (error) {
        elements.leadList.innerHTML = "";
        elements.emptyState.classList.remove("visible");
        elements.leadTotal.textContent = "Unavailable";

        showStatus(
          error.message || "Unable to load this product inbox.",
          "error"
        );

      } finally {
        setLoading(false);
      }
    }

    async function markLeadRead(lead) {
      if (!lead || lead.isRead !== false) return;

      await apiRequest(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "mark-read",
          productId,
          leadId: lead.id
        })
      });

      lead.isRead = true;
    }

    function getDialogFocusableElements() {
      return Array.from(
        elements.detailCard.querySelectorAll(
          'button:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'
        )
      ).filter(element => {
        return element.getClientRects().length > 0;
      });
    }

    async function openLead(leadId, opener = document.activeElement) {
      const lead = leads.find(
        item => String(item.id) === String(leadId)
      );

      if (!lead) return;

      selectedLead = lead;
      previousFocusedElement = opener;

      elements.detailTitle.textContent =
        lead.title || "Untitled lead";

      elements.detailExcerpt.textContent =
        lead.excerpt || "No additional description is available.";

      elements.detailNew.classList.toggle(
        "visible",
        lead.isRead === false
      );

      elements.visitSource.disabled =
        !validSourceUrl(lead.sourceUrl);

      elements.detailOverlay.classList.add("open");
      elements.detailOverlay.setAttribute("aria-hidden", "false");

      document.body.style.overflow = "hidden";

      elements.closeDetail.focus();

      if (lead.isRead === false) {
        try {
          await markLeadRead(lead);

          elements.detailNew.classList.remove("visible");

          const row = Array.from(
            elements.leadList.querySelectorAll(".lead-row")
          ).find(item => item.dataset.leadId === String(lead.id));

          if (row) {
            row.classList.remove("unread");

            const newLabel = row.querySelector(".new-label");

            if (newLabel) {
              newLabel.remove();
            }

            row.setAttribute(
              "aria-label",
              "Open lead: " + (lead.title || "Untitled lead")
            );
          }

          updateUnreadCount(
            leads.filter(item => item.isRead === false).length
          );

        } catch (error) {
          showStatus(
            "The lead opened, but its read status could not be updated.",
            "info"
          );
        }
      }
    }

    function closeLead() {
      if (!elements.detailOverlay.classList.contains("open")) {
        return;
      }

      elements.detailOverlay.classList.remove("open");
      elements.detailOverlay.setAttribute("aria-hidden", "true");

      document.body.style.overflow = "";

      selectedLead = null;

      if (
        previousFocusedElement &&
        document.contains(previousFocusedElement)
      ) {
        previousFocusedElement.focus();
      }

      previousFocusedElement = null;
    }

    function visitSelectedSource() {
      if (!selectedLead) return;

      const sourceUrl = validSourceUrl(selectedLead.sourceUrl);

      if (!sourceUrl) {
        showStatus(
          "This lead does not have a valid source link.",
          "error"
        );

        return;
      }

      window.open(sourceUrl, "_blank", "noopener,noreferrer");
    }

    elements.refreshButton.addEventListener("click", loadInbox);

    elements.closeDetail.addEventListener("click", closeLead);

    elements.visitSource.addEventListener(
      "click",
      visitSelectedSource
    );

    elements.detailOverlay.addEventListener("click", event => {
      if (event.target === elements.detailOverlay) {
        closeLead();
      }
    });

    document.addEventListener("keydown", event => {
      if (!elements.detailOverlay.classList.contains("open")) {
        return;
      }

      if (event.key === "Escape") {
        event.preventDefault();
        closeLead();
        return;
      }

      if (event.key === "Tab") {
        const focusable = getDialogFocusableElements();

        if (!focusable.length) {
          event.preventDefault();
          elements.detailCard.focus();
          return;
        }

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (
          !event.shiftKey &&
          document.activeElement === last
        ) {
          event.preventDefault();
          first.focus();
        }
      }
    });

    if (!productId || !productId.trim()) {
      elements.productName.textContent = "Product not found";
      elements.leadTotal.textContent = "Unavailable";
      elements.leadList.innerHTML = "";

      showStatus(
        "No product was specified. Return to your dashboard and select a product.",
        "error"
      );

      elements.refreshButton.disabled = true;

    } else {
      loadInbox();
    }
  </script>
</body>
</html>
